name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.darklua.json'
      - '.luaurc'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DARKLUA_VERSION: "0.19.0"

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest

    outputs:
      is_release: ${{ steps.version.outputs.is_release }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Parse Version and Release Notes
        id: version
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # First line of the commit message = version candidate
          RAW_VERSION=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)

          echo "Checking version candidate: $RAW_VERSION"

          # Semantic Versioning 2.0.0
          # Examples:
          #   1.0.0
          #   2.3.1
          #   1.0.0-beta
          #   2.0.0-rc.1
          #   1.2.3+build.5
          SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

          if [[ "$RAW_VERSION" =~ $SEMVER_REGEX ]]; then
            VERSION="$RAW_VERSION"

            echo "Valid release version detected: $VERSION"

            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            # Everything after the first line becomes the release notes
            printf '%s\n' "$COMMIT_MESSAGE" | tail -n +2 > release-notes.md

            # Remove leading blank lines
            sed -i '/./,$!d' release-notes.md

            # Use a default message if no release notes were provided
            if [[ ! -s "release-notes.md" ]]; then
              echo "Automated release for $VERSION" > release-notes.md
            fi

            echo "Release notes preview:"
            echo "---------------------"
            cat release-notes.md

            # Upload release notes so the release job can use them
            # without needing write access to the repository.
            mkdir -p release-metadata
            cp release-notes.md release-metadata/release-notes.md

          else
            echo "Commit message is not a SemVer release."
            echo "Skipping GitHub release creation."

            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release Metadata
        if: steps.version.outputs.is_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: release-metadata/release-notes.md
          retention-days: 1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install DarkLua
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing DarkLua v${DARKLUA_VERSION}..."

          curl -fsSL \
            "https://github.com/seaofvoices/darklua/releases/download/v${DARKLUA_VERSION}/darklua-linux-x86_64.zip" \
            -o darklua.zip

          unzip -q darklua.zip
          chmod +x darklua
          sudo mv darklua /usr/local/bin/darklua

          echo "Installed DarkLua:"
          darklua --version

      - name: Process & Bundle with DarkLua
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          darklua process \
            src/uiLib_v2/main.lua \
            build/build.lua

      - name: Verify Build Output
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "build/build.lua" ]]; then
            echo "ERROR: build/build.lua was not created."
            exit 1
          fi

          if [[ ! -s "build/build.lua" ]]; then
            echo "ERROR: build/build.lua is empty."
            exit 1
          fi

          echo "Build successful!"
          ls -lh build/build.lua

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/build.lua
          retention-days: 1

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build

    if: needs.prepare.outputs.is_release == 'true'

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: build
          path: build

      - name: Download Release Metadata
        uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: release

      - name: Check Release Does Not Already Exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "ERROR: Release $VERSION already exists."
            echo "Please bump your version number."
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ARGS=(
            "$VERSION"
            build/build.lua
            --title "$VERSION"
            --notes-file release/release-notes.md
            --target "$COMMIT_SHA"
          )

          # Versions containing "-" have a SemVer prerelease identifier.
          # Examples:
          #   1.0.0-beta
          #   1.0.0-rc.1
          #   2.0.0-alpha.3
          if [[ "$VERSION" == *-* ]]; then
            echo "Creating prerelease: $VERSION"
            RELEASE_ARGS+=(--prerelease)
          else
            echo "Creating stable release: $VERSION"
            RELEASE_ARGS+=(--latest)
          fi

          gh release create "${RELEASE_ARGS[@]}"